<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Macksons Solar - Hybrid System Calculator</title>
  <style>
    :root {
      --bg-grad: linear-gradient(135deg, #7c3aed 0%, #a855f7 48%, #ec4899 100%);
      --text: #1e1b4b;
      --text-soft: #6b7280;
      --radius: 22px;
      --radius-btn: 14px;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
      color: var(--text);
      background: var(--bg-grad);
      min-height: 100vh;
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    @keyframes floatSlow {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-6px) rotate(3deg); }
    }

    @keyframes popIn {
      from { opacity: 0; transform: translateY(14px) scale(0.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes cuteWiggle {
      0%, 100% { transform: rotate(0deg) scale(1.18); }
      25% { transform: rotate(-10deg) scale(1.22); }
      75% { transform: rotate(10deg) scale(1.22); }
    }

    .glass-card {
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(20px);
      border-radius: var(--radius);
      padding: 2.5rem;
      max-width: 500px;
      width: 100%;
      border: 2px solid rgba(255, 255, 255, 0.65);
      box-shadow: 0 20px 45px rgba(30, 27, 75, 0.22);
      animation: popIn 0.45s cubic-bezier(0.34, 1.56, 0.64, 1) both;
    }

    .header {
      text-align: center;
      margin-bottom: 1.75rem;
    }

    .logo {
      width: 82px;
      height: 82px;
      background: linear-gradient(135deg, #f59e0b, #ea580c);
      border-radius: 26px;
      margin: 0 auto 1.25rem;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 24px rgba(234, 88, 12, 0.35);
      animation: floatSlow 3.5s ease-in-out infinite;
    }

    h1 {
      font-size: 1.9rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--text);
    }

    .subtitle {
      color: #7c3aed;
      font-size: 1rem;
      font-weight: 700;
      margin-top: 0.2rem;
    }

    .creator {
      color: var(--text-soft);
      font-size: 0.88rem;
      margin-top: 0.3rem;
    }

    .btn-grid {
      display: flex;
      flex-direction: column;
      gap: 0.95rem;
    }

    .btn {
      --g1: #ea580c;
      --g2: #db2777;
      --glow: rgba(219, 39, 119, 0.35);

      display: flex;
      align-items: center;
      gap: 12px;
      padding: 15px 18px;
      border-radius: var(--radius-btn);
      background: linear-gradient(135deg, var(--g1), var(--g2));
      color: #fff;
      font-size: 0.98rem;
      font-weight: 700;
      text-decoration: none;
      position: relative;
      overflow: hidden;
      box-shadow: 0 6px 16px var(--glow);
      transition: transform 0.28s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.25s ease;
    }

    .btn::after {
      content: '';
      position: absolute;
      inset: 0;
      left: -110%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.22), transparent);
      transition: left 0.55s ease;
    }

    .btn:hover::after {
      left: 110%;
    }

    .btn:hover {
      transform: translateY(-4px) scale(1.015);
      box-shadow: 0 12px 24px var(--glow);
    }

    .btn:active {
      transform: translateY(0) scale(0.97);
    }

    .btn-icon {
      font-size: 1.3rem;
      display: inline-flex;
      transition: transform 0.25s ease;
    }

    .btn:hover .btn-icon {
      animation: cuteWiggle 0.5s ease;
    }

    .btn-text {
      flex: 1;
    }

    .btn-arrow {
      font-size: 1.15rem;
      font-weight: 800;
      transition: transform 0.28s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .btn:hover .btn-arrow {
      transform: translateX(6px);
    }

    /* Slightly darker cute color themes */
    .btn-advanced {
      --g1: #f59e0b;
      --g2: #ea580c;
      --glow: rgba(234, 88, 12, 0.35);
    }

    .btn-load {
      --g1: #10b981;
      --g2: #047857;
      --glow: rgba(4, 120, 87, 0.35);
    }

    .btn-clamp {
      --g1: #9333ea;
      --g2: #db2777;
      --glow: rgba(219, 39, 119, 0.35);
    }

    .btn-system {
      --g1: #0284c7;
      --g2: #4f46e5;
      --glow: rgba(79, 70, 229, 0.35);
    }

    @media (max-width: 480px) {
      .glass-card {
        padding: 1.85rem 1.35rem;
        border-radius: 18px;
      }

      h1 {
        font-size: 1.65rem;
      }

      .btn {
        padding: 14px 15px;
        font-size: 0.93rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>
<body>
  <main class="glass-card">
    <header class="header">
      <div class="logo">
        <img src="pv.png" alt="Macksons Solar PV logo" width="46" height="46">
      </div>
      <h1>Hybrid System Calculator</h1>
      <p class="subtitle">Macksons Solar</p>
      <p class="creator">Created by Milan Methnuwan</p>
    </header>

    <nav class="btn-grid" aria-label="Calculator tools">
      <a href="advanced-appliance-load-calculation.html" class="btn btn-advanced">
        <span class="btn-icon" aria-hidden="true">🔥</span>
        <span class="btn-text">Home Appliance - Advanced Load Calculation</span>
        <span class="btn-arrow" aria-hidden="true">→</span>
      </a>

      <a href="appliance-load-calculation.html" class="btn btn-load">
        <span class="btn-icon" aria-hidden="true">⚡</span>
        <span class="btn-text">Home Appliance - Load Calculation</span>
        <span class="btn-arrow" aria-hidden="true">→</span>
      </a>

      <a href="clamp-load-calculation.html" class="btn btn-clamp">
        <span class="btn-icon" aria-hidden="true">📟</span>
        <span class="btn-text">Clamp Meter - Load Calculation</span>
        <span class="btn-arrow" aria-hidden="true">→</span>
      </a>

      <a href="system-recommendation.html" class="btn btn-system">
        <span class="btn-icon" aria-hidden="true">🔋</span>
        <span class="btn-text">Hybrid System Suggester</span>
        <span class="btn-arrow" aria-hidden="true">→</span>
      </a>
    </nav>
  </main>
</body>
</html>
